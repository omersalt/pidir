appId: com.pidir.app
productName: Pidır
directories:
  buildResources: build
files:
  - '**/*'
  - '!**/.vscode/*'
  - '!src/**'
  - '!arac/**'
  - '!_pdfx-kaynak/**'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.prettierignore,.prettierrc.yaml,.editorconfig,dev-app-update.yml,README.md,README.tr.md,SPEC.md,PLAN.md}'
  - '!sunucu/**'          # telemetri toplayıcısı sunucuda çalışır, istemciye girmez
  - '!.github/**'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml,yarn.lock}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!scripts/**'
  - '!resources/**'
  - '!*.pdf'
  - '!_*'
  # thumb/ = Explorer kabuk uzantısı (ayrı ürün, regsvr32 ile kaydedilir); src'de hiç
  # referansı yok. Dışlanmazsa 1,75 MB .obj derleme çöpü + host_test.exe/render_test.exe
  # kullanıcıya teslim edilen app.asar'a girer — electron-builder varsayılan filtresinde
  # .o ve .cc var ama .obj/.exe/.dll YOK.
  - '!thumb/**'
  - '!native/**'          # macOS Objective-C++ kaynağı, npm script'lerinden çağrılmıyor
  - '!assets/**'          # yalnız kullanılmayan pdfx.png (2,16 MB) — asar'ın %35'iydi
  - '!docs/**'
  # Glob'lar büyük/küçük harfe duyarlı — 'OLCUM-CALISTIR.cmd' ilk denemede asar'a sızdı.
  - '!{olc,OLC}*'         # geçici ölçüm betikleri
  - '!*.{cmd,bat,ps1,log,tsbuildinfo}'
# Türkçe + İngilizce OCR verisini (tesseract) uygulama yanında taşı.
extraResources:
  - from: resources/ocr
    to: ocr
  - from: arac/pidir_sidecar.py
    to: arac/pidir_sidecar.py
  - from: arac/pidir_docx.py
    to: arac/pidir_docx.py
# NOT: "Sadeleştir" özelliği yerel Python + PyMuPDF sidecar'ına ihtiyaç duyar
# (arac/pidir_sidecar.py ayrıca teslim edilir). Okuma/sayfa düzenleme kendi kendine yeter.
fileAssociations:
  - ext: pdf
    name: PDF Belgesi
    description: PDF Belgesi
    role: Viewer
  - ext: docx
    name: Word Belgesi
    description: Word Belgesi
    role: Viewer
  - ext: csv
    name: CSV Tablosu
    description: Virgülle Ayrılmış Tablo
    role: Viewer
  - ext: tsv
    name: TSV Tablosu
    description: Sekmeyle Ayrılmış Tablo
    role: Viewer
  - ext: json
    name: JSON Belgesi
    description: JSON Belgesi
    role: Viewer
  - ext: md
    name: Markdown Belgesi
    description: Markdown Belgesi
    role: Viewer
  - ext: markdown
    name: Markdown Belgesi
    description: Markdown Belgesi
    role: Viewer
  - ext: txt
    name: Metin Belgesi
    description: Metin Belgesi
    role: Viewer
win:
  executableName: pidir
  # NSIS kurulum, portable'ın YERİNE geçti. Portable hedefi her çalıştırmada 98 MB'lık
  # SFX'i %TEMP%'e açıyordu: ölçüldü, PDF'e çift tıklamada 4746 ms (sıcak: 4649 ms).
  # Kurulu sürümde aynı iş 291 ms. Fark tamamen paket biçiminden geliyordu.
  target:
    - nsis
portable:
  artifactName: ${productName}-${version}-portable.${ext}
nsis:
  artifactName: ${name}-${version}-kurulum.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  # Tek tık kurulum (Chrome/VS Code deseni). "assisted" kip (oneClick:false +
  # allowToChangeInstallationDirectory) sessiz kurulumda (/S) erişim ihlaliyle
  # çöküyordu; ayrıca otomatik güncelleme zaten sessiz kurulum yolunu kullanıyor,
  # yani her güncellemede sihirbaz göstermek istemediğimiz için de doğrusu bu.
  oneClick: true
  # perMachine KASITEN false: Program Files'a kurulsaydı HER otomatik güncelleme
  # yönetici onayı (UAC penceresi) isterdi ve "hiç rahatsız etmeyen güncelleme"
  # sözü tutulamazdı. Chrome/VS Code de aynı sebeple kullanıcı klasörüne kurulur.
  perMachine: false
  runAfterFinish: false
  deleteAppDataOnUninstall: false

# Otomatik güncelleme kanalı. bisiler.com'un TAMAMI BasicAuth arkasında olduğu için
# anonim bir kullanıcı oradan güncelleme indiremezdi; GitHub Releases hem açık hem CDN'li.
# Telemetri yine bisiler'e gidiyor (src/main/telemetri.ts) — yalnız binary dağıtımı burada.
publish:
  provider: github
  owner: omersalt
  repo: pidir
npmRebuild: false
